name: Bug report
description: Something in STEJECT doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste tokens, API keys or private code** here.
        Security problems go to the Security tab → Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Ship
        2. Paste …
        3. Click …
  - type: dropdown
    id: where
    attributes:
      label: Where do you use STEJECT?
      options: [Desktop app (Windows), Desktop app (Mac), Desktop app (Linux), Web version in a browser]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → App shows it, e.g. 1.3.0
  - type: dropdown
    id: ai
    attributes:
      label: AI helper (if it matters)
      options: [Not related to AI, Groq, Ollama, In-browser AI, Other OpenAI-style service]
  - type: textarea
    id: log
    attributes:
      label: Error message or log
      description: Copy the message or the push log. Remove anything private first.
      render: text
